[pytest]
testpaths = tests

# `auto` es lo que pide el simulador de cliente de NiceGUI: su fixture `user` es
# un generador asíncrono, y en modo estricto pytest-asyncio no lo reconoce y
# todas las pruebas de pantalla salen en ERROR de setup — no en rojo, en ERROR,
# que es peor porque parece un problema de entorno y se acaba ignorando.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Las APIs legadas de SQLAlchemy 2.0 son un FALLO, no un aviso.
#
# `Query.get()` vivía en 28 sitios y la suite solo mostraba UN aviso: el de la
# única ruta que las pruebas recorrían. Un aviso mide qué se ejecutó, no cuánta
# deuda hay, y por eso nadie lo miraba. Como error, cualquier uso nuevo tumba la
# suite el día que se escribe, que es cuando cuesta barato arreglarlo.
#
# Esto no cierra la puerta a nadie: si algún día hace falta una API legada a
# propósito, se marca esa prueba con
# `@pytest.mark.filterwarnings("default::sqlalchemy.exc.LegacyAPIWarning")` y
# queda dicho por qué, que es justo lo que un aviso global no obliga a hacer.
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
