    <!--
      Aquí NO va ningún enlace a fonts.googleapis.com.

      El andamiaje de Angular los pone por defecto, y en dos de los tres perfiles
      de despliegue —`onprem` y `standalone`, que son los que se instalan en casa
      del cliente— no hay internet: la tipografía caería a la del sistema y los
      iconos se verían como palabras sueltas («menu», «download») encima de los
      botones. La aplicación no fallaría; se vería ROTA, que es peor, porque
      parece un defecto del producto y nadie lo atribuye a la red.

      La tipografía es la del sistema y los iconos viajan dentro del paquete
      (`material-icons`, declarado en angular.json). Nada sale a la red.
    -->
  </head>

    <app-root></app-root>
  </body>
