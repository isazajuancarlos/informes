# Perfil STANDALONE — una sola máquina, sin base de datos que administrar.
# SQLite dentro del propio contenedor, offline. Lo más simple para un cliente
# pequeño que solo quiere "arrancarlo y usarlo".
#
#   1. (opcional) export STORAGE_SECRET=un_secreto_propio
#   2. docker compose -f docker-compose.standalone.yml up -d
#   3. abre http://localhost:8003
#
# El volumen 'data' persiste TODO el estado: la base SQLite (storage/informes.db)
# y los archivos subidos (storage/uploads). Respaldar = copiar ese volumen.

services:
  app:
    build: .
    environment:
      DEPLOYMENT_PROFILE: standalone
      STORAGE_SECRET: ${STORAGE_SECRET:-cambia_este_secreto}
      RELOAD: "false"
    ports:
      - "8003:8003"
    volumes:
      - data:/app/storage
    restart: unless-stopped

volumes:
  data:
