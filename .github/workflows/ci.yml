# CI del producto: el port en Rust + Angular.
#
# Tras el cutover a Rust, `informes` es un binario axum con la interfaz Angular
# embebida; el Python quedó en la historia de git. El CI prueba lo que se
# entrega: el workspace Rust (test + clippy con -D warnings) y la construcción
# de la interfaz.
name: CI

# CADA CAMBIO SE PRUEBA UNA VEZ, NO DOS.
#
# Esto decía `push: branches: ["**"]` junto a `pull_request`, y con un PR abierto
# GitHub dispara los DOS: cada empujón a una rama lanzaba el CI entero por
# duplicado —5 trabajos × 2— sin que la segunda vuelta comprobara nada que la
# primera no hubiera comprobado ya. Se veía en `gh pr checks`, que listaba ocho
# comprobaciones donde hay cuatro; costó darse cuenta porque el ruido parecía
# normal.
#
# No es una optimización cosmética: `informes` y `medico` son PRIVADOS y sus
# minutos salen del cupo de la cuenta (los públicos como quipu los tienen
# gratis). El 2026-07-31 ese cupo se agotó a media tarde y **el CI de los dos
# productos comerciales se paró**: los trabajos ni arrancaban. La mitad de lo
# gastado ese día fue esta duplicación.
#
# EL PRECIO, para que nadie lo descubra por sorpresa: una rama SIN PR abierto ya
# no lanza CI. Es deliberado — aquí toda rama que importa acaba en un PR, y el
# PR la prueba. `main` sí conserva su `push`, porque es lo publicado y tiene que
# verificarse aunque algo entre por otra vía.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Menor privilegio (supply-chain #203): este CI solo prueba, con checkout de
  # solo lectura. Sin este bloque el GITHUB_TOKEN hereda permisos amplios.
  contents: read

jobs:
  rust:
    name: rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cabeceras de SQLite
        # `libsqlite3-sys` enlaza el SQLite del sistema (no bundled): sin las
        # cabeceras de desarrollo, la compilación no encuentra sqlite3.h.
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Clippy (el CI usa -D warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas del workspace
        working-directory: rust
        run: cargo test --workspace --all-targets

  frontend:
    name: frontend (ng build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular CLI exige >= 22.22.3; el node del sistema de desarrollo se
          # quedó un parche por debajo (ver tarea #80).
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - name: Instalar (limpio, desde el lockfile)
        working-directory: angular
        run: npm ci
      - name: Construir la interfaz
        working-directory: angular
        run: npx ng build

  auditoria-deps:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # RustSec: falla si alguna dependencia tiene un CVE publicado. El único
      # ignore vive en rust/.cargo/audit.toml, preciso y justificado. Cierra
      # OWASP A03 (Software Supply Chain Failures).
      - name: cargo-audit
        working-directory: rust
        run: |
          cargo install cargo-audit --locked
          cargo audit

  cadena-suministro:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # cargo-deny endurece la cadena de suministro más allá de los CVEs: exige
      # que TODA dependencia venga de una fuente autorizada (crates.io), prohíbe
      # comodines de versión externos y controla licencias. Es la defensa contra
      # que una dep se traiga desde una fuente inesperada — el vector del ataque
      # Atomic Arch a AUR. Config en rust/deny.toml.
      - name: cargo-deny
        working-directory: rust
        run: |
          cargo install cargo-deny --locked
          cargo deny check
