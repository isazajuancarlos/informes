# Perfil ONPREM — el cliente lo corre en su propio servidor / LAN.
# App + PostgreSQL, sin dependencia de internet. Los datos viven en su máquina.
#
#   1. cp .env.example .env   y ajusta DB_PASSWORD y STORAGE_SECRET
#   2. docker compose up -d
#   3. abre http://<servidor>:8003
#
# Para un entorno air-gapped (sin internet ni para bajar imágenes), ver DESPLIEGUE.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: informes
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave}
      POSTGRES_DB: informes
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U informes"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DEPLOYMENT_PROFILE: onprem
      DATABASE_URL: postgresql://informes:${DB_PASSWORD:-cambia_esta_clave}@db/informes
      STORAGE_SECRET: ${STORAGE_SECRET:-cambia_este_secreto}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8003}
      RELOAD: "false"
    ports:
      - "8003:8003"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  uploads:
